<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엑셀 실무 퀘스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 블로그 대표이미지 틀을 그대로: 연민트 바탕 + 큰 원 두 개(민트, 라벤더), 남색 굵은 제목 + 초록 강조, 흰 둥근 카드, 알약 배지와 체크 칩.
   한 화면 구성: 표지(제목 + 내 직급 카드) → 레벨 지도 → 지금 레벨 카드. 한 가지 테마로 고정. */
:root{
  color-scheme:light;
  --bg:#ecf7f1; --blob-mint:#d2efe2; --blob-lav:#e0d9f7; --surface:#ffffff;
  --ink:#29264f; --muted:#5d5a7c; --line:#dcebe4;
  --accent:#2fa37a; --accent-deep:#1f7d5c; --accent-soft:#e1f4ec;
  --lav:#7a68c8; --lav-soft:#efebfb;
  --warn:#c2571d; --warn-soft:#fdeee4;
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --shadow:0 10px 30px rgba(41,38,79,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:absolute;border-radius:50%;z-index:0;pointer-events:none}
body::before{width:520px;height:520px;right:-190px;top:-200px;background:var(--blob-mint)}
body::after{width:420px;height:420px;left:-210px;top:560px;background:var(--blob-lav)}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:36px 16px 64px;display:flex;flex-direction:column;gap:22px}
header{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.tag{display:inline-block;font-size:.95rem;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:6px 16px;margin-bottom:14px}
header h1{font-weight:900;font-size:clamp(2.1rem,6.2vw,3.3rem);line-height:1.12;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
header h1 span{display:block;color:var(--accent)}
header p{margin:0;color:var(--muted);max-width:44ch;font-size:1.02rem}
.rank{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;min-width:230px;display:flex;flex-direction:column;gap:8px}
.rank small{font-size:.78rem;font-weight:700;color:var(--lav);letter-spacing:.04em}
.rank strong{font-size:1.25rem;font-weight:900;line-height:1.25}
.bar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s ease}
.rank span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
nav{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px 14px 14px;display:flex;flex-direction:column;gap:12px}
.mapscroll{overflow-x:auto;padding-bottom:4px}
.steps{display:flex;list-style:none;margin:0;padding:0;min-width:640px}
.steps li{flex:1;position:relative;display:flex;justify-content:center}
.steps li+li::before{content:"";position:absolute;top:21px;right:50%;width:100%;height:4px;background:var(--line);z-index:0}
.steps li.reached+li::before{background:var(--accent)}
.steps button{position:relative;z-index:1;font:inherit;background:none;border:0;padding:0 2px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:12px}
.steps .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.95rem;background:var(--surface);border:4px solid var(--line);color:var(--muted)}
.steps .lbl{font-size:.8rem;font-weight:700;white-space:nowrap}
.steps button.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.steps button.open .dot{border-color:var(--accent);color:var(--accent-deep)}
.steps button.current .dot{box-shadow:0 0 0 5px var(--accent-soft)}
.steps button.current .lbl{color:var(--accent-deep)}
.steps button[disabled]{cursor:not-allowed}
.steps button[disabled] .dot{border-style:dashed}
.steps button[disabled] .lbl{color:var(--muted);font-weight:500}
.soon{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);padding:0 6px}
.soon b{font-weight:700;color:var(--lav)}
.soon span{background:var(--lav-soft);color:var(--lav);border-radius:999px;padding:2px 10px;font-weight:500}
button:focus-visible,input:focus-visible,a:focus-visible,.scroll:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:30px;display:flex;flex-direction:column;gap:22px}
.card h2{font-weight:900;font-size:1.7rem;line-height:1.25;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card h2 em{font-style:normal;color:var(--accent)}
.card h3{font-size:.9rem;font-weight:700;color:var(--accent-deep);margin:0 0 8px}
.memo{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.memo .face{width:46px;height:46px;border-radius:50%;background:var(--lav-soft);color:var(--lav);display:grid;place-items:center;font-weight:900;font-size:.85rem}
.memo .bubble{background:var(--lav-soft);border-radius:4px 20px 20px 20px;padding:12px 18px}
.memo .who{font-size:.8rem;font-weight:700;color:var(--lav)}
.memo p{margin:2px 0 0;max-width:60ch}
.task{background:var(--bg);border-radius:18px;padding:16px 20px}
.task p{margin:0;max-width:65ch;font-weight:500}
.paste{margin:-12px 0 0;max-width:65ch}
.task .note{color:var(--muted);font-size:.9rem;font-weight:400;margin-top:6px}
.data{display:flex;flex-direction:column;gap:16px}
.tablehead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tablehead strong{font-size:.98rem;font-weight:700}
.tablehead span{color:var(--muted);font-size:.8rem;font-weight:400}
.copy{font:inherit;font-size:.85rem;font-weight:700;border:2px solid var(--accent);color:var(--accent-deep);background:var(--surface);border-radius:999px;padding:5px 16px;cursor:pointer}
.copy:hover{background:var(--accent-soft)}
.copy[disabled]{border-color:var(--line);color:var(--muted);cursor:default}
.scroll{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--accent);color:#fff;font-weight:700}
tbody tr:nth-child(even) td{background:#f6fbf8}
td.num,th.num{text-align:right}
.copymsg{font-size:.85rem;color:var(--accent-deep);min-height:1.4em;margin:4px 0 0}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--accent-soft);border-radius:20px;padding:18px 20px}
form label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:700;color:var(--accent-deep);flex:1 1 240px}
form input{font:inherit;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 16px;border:2px solid transparent;border-radius:14px;background:var(--surface);color:var(--ink);width:100%}
form input:focus{border-color:var(--accent);outline:none}
.primary{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 24px;cursor:pointer}
.primary:hover{background:var(--accent-deep)}
.hintbtn{padding:11px 18px}
.hints{background:var(--lav-soft);border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.hints p{margin:0;max-width:65ch}
.hints b{display:inline-block;background:var(--lav);color:#fff;border-radius:999px;font-size:.75rem;padding:1px 10px;margin-right:6px}
.hints a{color:var(--lav);font-weight:700}
.result{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;position:relative}
.result.ok{background:var(--accent-soft)}
.result.no{background:var(--warn-soft)}
.result .head{font-weight:900;font-size:1.15rem}
.result.ok .head{color:var(--accent-deep)}
.result.no .head{color:var(--warn);font-size:1rem}
.result p{margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--surface);color:var(--accent-deep);font-weight:700;font-size:.85rem;border-radius:999px;padding:4px 14px}
.next{align-self:flex-start;margin-top:4px}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet h4{margin:0;font-size:.9rem;font-weight:700}
.sheet .scroll{max-height:345px;border-radius:8px}
.sheet th,.sheet td{padding:6px 10px}
.sheet th.rc,.sheet td.rc{background:#eef1f0;color:var(--muted);text-align:center;font-weight:500;position:sticky;left:0}
.sheet thead th{background:#eef1f0;color:var(--muted);text-align:center;font-weight:500}
.sheet tbody tr td{background:var(--surface)}
.sheet tr.hd td{font-weight:700;background:var(--accent-soft);color:var(--accent-deep)}
.sheet td.hl{background:var(--warn-soft);color:var(--warn);font-weight:700}
.sheet td.ans{outline:3px solid var(--accent);outline-offset:-3px;font-weight:900}
.fx{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem;margin:0}
.fx dt{font-weight:700;color:var(--accent-deep)}
.fx dd{margin:0;font-family:Consolas,"D2Coding",monospace;overflow-wrap:anywhere}
.gate p{margin:0;max-width:60ch}
.gatemsg{font-weight:700;min-height:1.5em}
.gatemsg.no{color:var(--warn)}
.gatemsg a{color:var(--lav);font-weight:700}
.quiz{background:var(--accent-soft);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.quiz .q{margin:0;font-weight:700;font-size:1.08rem;max-width:60ch}
.quiz .qno{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;font-size:.78rem;padding:2px 10px;margin-right:8px;vertical-align:2px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices button{font:inherit;font-weight:700;font-size:1.05rem;background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left}
.choices button:hover{border-color:var(--accent)}
.choices button b{color:var(--accent-deep);margin-right:8px}
.ghost{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
footer{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;color:var(--muted);font-size:.85rem}
footer b{color:var(--accent);font-weight:700}
.confirm{display:inline-flex;gap:10px;align-items:center}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:20px}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(340px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.bar i{transition:none}}
[hidden]{display:none !important}
@media (max-width:640px){header{grid-template-columns:1fr}.rank{min-width:0}.card{padding:22px 16px;border-radius:22px}.card h2{font-size:1.4rem}form{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="tag">📊 엑셀 실무 퀘스트 · 보고 트랙</span>
      <h1>엑셀 실무 퀘스트<span>수출팀 신입의 1년</span></h1>
      <p>가상의 화장품 회사 수출팀에 입사했습니다. 엑셀로 업무를 처리하고 답을 입력하면 다음 레벨이 열립니다. 회사, 바이어, 숫자는 모두 연습용 가상 데이터입니다.</p>
    </div>
    <div class="rank" id="rankCard" aria-live="polite">
      <small>지금 내 직급</small>
      <strong id="rank"></strong>
      <div class="bar"><i id="bar"></i></div>
      <span id="count"></span>
    </div>
  </header>
  <nav aria-label="레벨 지도" id="map">
    <div class="mapscroll" tabindex="0"><ol class="steps" id="steps"></ol></div>
    <div class="soon" id="soon"></div>
  </nav>
  <section class="card gate" id="gate" hidden>
    <h2><em>입사 시험.</em> 엑셀 문제 하나만 맞히면 시작해요</h2>
    <p>수출팀 첫 출근 전에 간단한 엑셀 문제를 풀어 주세요. 한 번 맞히면 이 브라우저에서는 다시 묻지 않습니다.</p>
    <div class="quiz">
      <p class="q" id="quizQ"></p>
      <div class="choices" id="quizChoices" role="group" aria-labelledby="quizQ"></div>
    </div>
    <p class="gatemsg" id="gateMsg" role="status"></p>
  </section>
  <main class="card" id="card"></main>
  <footer id="foot">
    <span><b>일잘러워킹맘</b> · <span id="saveNote">진행 상황은 이 브라우저에 저장됩니다.</span></span>
    <span>
      <button class="ghost" id="resetBtn" type="button">처음부터 다시 하기</button>
      <span class="confirm" id="resetConfirm" hidden>기록을 지울까요?
        <button class="ghost" id="resetYes" type="button">지우기</button>
        <button class="ghost" id="resetNo" type="button">취소</button>
      </span>
    </span>
  </footer>
</div>
